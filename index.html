<head>

<body class="phone-page">

    <main class="splash-screen">

        <div class="splash-glow"></div>

        <div class="pd-crown">

        <p>

        </p>

        <div class="splash-wave">
            <span></span>
            <span></span>
            <span></span>

<script
    type="module"
    src="auth-guard.js"
></script>
<script type="module" src="notification.js"></script>
<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>
<script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")
            .then(registration => {

                console.log("❤️ PD Service Worker registered:", registration.scope);

            })
            .catch(error => {

                console.error("❌ PD Service Worker registration failed:", error);

            });

    });

}
</script>
</body>
</html>
