<div class="setting-row">

<i class="fa-solid fa-bell"></i>



<p id="pd-notification-status" aria-live="polite"></p>

<script type="module">
    import { enablePDNotifications } from "./notifications.js";

    const button = document.getElementById("enable-pd-notifications");
    const status = document.getElementById("pd-notification-status");

    button.addEventListener("click", async () => {
        button.disabled = true;
        status.textContent = "Enabling notifications…";

        try {
            await enablePDNotifications();
            status.textContent = "PD notifications are enabled 💜";
        } catch (error) {
            console.error(error);
            status.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    });
</script>

<div>
<strong>Notifications</strong>
<span>On</span>
</div>

<label class="switch">
<input type="checkbox" checked>
<span></span>
</label>

</div>
<input type="checkbox" id="pd-notifications-toggle" checked>
