<!-- =====================================================
     SLIDESHOW SCRIPT
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const slides =
            document.querySelectorAll(".slide");

        const dotsContainer =
            document.getElementById("slideDots");

        let currentSlide = 0;


        /* CREATE DOTS */

        slides.forEach(
            (slide, index) => {

                const dot =
                    document.createElement("span");

                dot.className =
                    index === 0
                        ? "active"
                        : "";

                dotsContainer.appendChild(dot);

            }
        );


        const dots =
            dotsContainer.querySelectorAll("span");


        /* SHOW SLIDE */

        function showSlide(index) {

            slides.forEach(
                slide => {

                    slide.classList.remove(
                        "active"
                    );

                }
            );


            dots.forEach(
                dot => {

                    dot.classList.remove(
                        "active"
                    );

                }
            );


            slides[index].classList.add(
                "active"
            );

            dots[index].classList.add(
                "active"
            );


            const video =
                slides[index].querySelector(
                    "video"
                );


            if (video) {

                video.currentTime = 0;

                video.play().catch(
                    () => {}
                );

            }

        }


        /* CHANGE EVERY 5 SECONDS */

        setInterval(
            () => {

                currentSlide++;

                if (
                    currentSlide >=
                    slides.length
                ) {

                    currentSlide = 0;

                }

                showSlide(currentSlide);

            },
            5000
        );

    }
);

</script>
