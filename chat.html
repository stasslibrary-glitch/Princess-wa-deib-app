
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PD | Chat</title>

<link rel="stylesheet" href="style.css">

<link
href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="phone-page">

<div class="phone-app chat-app">

    <!-- CHAT HEADER -->

    <header class="chat-header">

        <a href="home.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="chat-person">

           <div class="person-avatar">
    <img
        src="slideshow/photo2.jpg"
        alt="My Princess"
    >
        </div>

            <div>

                <strong>
                    <span data-user-name>
                        My Princess ❤️
                    </span>
                </strong>

                <span class="online-status">
                    online
                </span>

            </div>

        </div>

        <div class="chat-actions">

            <i class="fa-solid fa-phone"></i>

            <i class="fa-solid fa-ellipsis-vertical"></i>

        </div>

    </header>


    <!-- MESSAGES -->

    <main
        class="chat-messages"
        id="chatMessages"
    >

        <!-- Firebase messages appear here -->

    </main>


    <!-- MESSAGE INPUT -->

    <form
        class="chat-input"
        id="chatForm"
    >

        <button
            type="button"
            class="emoji-button"
            data-emoji
        >
            <i class="fa-regular fa-face-smile"></i>
        </button>


        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
        >


        <button
            type="button"
            class="attach-button"
        >
            <i class="fa-solid fa-paperclip"></i>
        </button>


        <button
            class="send-message"
            type="submit"
        >
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </form>

</div>


<script
    type="module"
    src="auth-guard.js"
></script>

<script
    type="module"
    src="chat.js"
></script>

</body>

</html>
