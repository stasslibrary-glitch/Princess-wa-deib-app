
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#090514"
    >

    <title>Just Because... ❤️</title>

    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


<style>

/* =========================================================
   PD — JUST BECAUSE
   SECRET SURPRISE PAGE
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100dvh;

    overflow-x: hidden;

    font-family:
        "DM Sans",
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(166,76,255,.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(255,48,145,.20),
            transparent 32%
        ),

        linear-gradient(
            145deg,
            #08040f,
            #17091e,
            #090512
        );
}


/* =========================================================
   BACKGROUND PHOTOS
   ========================================================= */

.photo-bg {

    position: fixed;

    inset: 0;

    z-index: -5;

    overflow: hidden;
}

.photo-bg img {

    position: absolute;

    width: 50%;
    height: 50%;

    object-fit: cover;

    opacity: .16;

    filter:
        blur(1px)
        saturate(.9);

    transition:
        opacity 1s ease,
        transform 8s ease;
}

.photo-bg img:nth-child(1) {
    top: 0;
    left: 0;
}

.photo-bg img:nth-child(2) {
    top: 0;
    right: 0;
}

.photo-bg img:nth-child(3) {
    bottom: 0;
    left: 0;
}

.photo-bg img:nth-child(4) {
    bottom: 0;
    right: 0;
}

.photo-bg::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(8,4,15,.72),
            rgba(18,5,25,.65),
            rgba(8,4,15,.82)
        );
}


/* =========================================================
   MOVING LIGHT
   ========================================================= */

.light {

    position: fixed;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(190,90,255,.16),
            transparent 70%
        );

    filter: blur(10px);

    pointer-events: none;

    animation:
        lightMove 12s ease-in-out infinite alternate;
}

.light.one {
    top: -80px;
    left: -80px;
}

.light.two {
    bottom: -100px;
    right: -80px;

    animation-delay: -5s;
}

@keyframes lightMove {

    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(90px,60px) scale(1.25);
    }
}


/* =========================================================
   STARS
   ========================================================= */

.stars {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: -1;
}

.star {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    opacity: .5;

    box-shadow:
        0 0 8px rgba(255,255,255,.8);

    animation:
        twinkle
        var(--speed)
        ease-in-out
        infinite alternate;
}

@keyframes twinkle {

    from {
        opacity: .15;
        transform: scale(.7);
    }

    to {
        opacity: .9;
        transform: scale(1.4);
    }
}


/* =========================================================
   MAIN
   ========================================================= */

.page {

    min-height: 100dvh;

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        30px
        18px;
}


/* =========================================================
   CARD
   ========================================================= */

.card {

    position: relative;

    width: 100%;

    max-width: 430px;

    padding:
        38px
        25px
        30px;

    text-align: center;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.45),

        inset 0 1px 0
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    overflow: hidden;

    animation:
        cardIn
        .9s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn {

    from {
        opacity: 0;
        transform:
            translateY(30px)
            scale(.94);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TOP HEART
   ========================================================= */

.big-heart {

    width: 80px;
    height: 80px;

    margin:
        0
        auto
        20px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,70,155,.28),
            rgba(140,65,255,.12)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 0 30px
        rgba(255,55,145,.25);

    animation:
        heartBeat
        1.5s
        ease-in-out
        infinite;
}

.big-heart i {

    font-size: 34px;

    color: #ff5ca8;

    text-shadow:
        0 0 12px #ff3d91,
        0 0 30px rgba(255,50,145,.65);
}

@keyframes heartBeat {

    0%,
    100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.08);
    }

    30% {
        transform: scale(.98);
    }

    45% {
        transform: scale(1.06);
    }
}


/* =========================================================
   LABEL
   ========================================================= */

.small-label {

    color:
        rgba(255,255,255,.55);

    font-size: 11px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 9px;
}


/* =========================================================
   TITLE
   ========================================================= */

h1 {

    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(
            34px,
            9vw,
            48px
        );

    line-height: 1.05;

    margin-bottom: 15px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #ffb7dc,
            #d7b2ff
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    margin:
        14px
        0
        20px;
}

.divider span {

    height: 1px;

    width: 45px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25)
        );
}

.divider span:last-child {

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.25),
            transparent
        );
}

.divider i {

    color: #ff5ca8;

    font-size: 10px;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message {

    color:
        rgba(255,255,255,.82);

    font-size: 14px;

    line-height: 1.75;

    min-height: 105px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        0
        5px;

    animation:
        messageAppear
        .7s
        ease;
}

.message strong {

    color: #ffacd2;
}

@keyframes messageAppear {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   LITTLE QUOTE
   ========================================================= */

.quote {

    margin-top: 10px;

    color:
        rgba(255,255,255,.42);

    font-family:
        "Playfair Display",
        serif;

    font-size: 13px;

    font-style: italic;
}


/* =========================================================
   SURPRISE BUTTON
   ========================================================= */

.next-message {

    margin-top: 25px;

    width: 100%;

    padding: 14px 20px;

    border: none;

    border-radius: 25px;

    cursor: pointer;

    color: white;

    font-family:
        "DM Sans",
        sans-serif;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: .7px;

    background:
        linear-gradient(
            135deg,
            #9148ff,
            #f03b93
        );

    box-shadow:
        0 8px 25px
        rgba(190,50,160,.30);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.next-message:hover {

    transform: translateY(-2px);

    box-shadow:
        0 12px 32px
        rgba(190,50,160,.45);
}

.next-message:active {

    transform: scale(.96);
}


/* =========================================================
   BACK HOME
   ========================================================= */

.home-button {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    margin-top: 18px;

    padding: 9px 15px;

    color:
        rgba(255,255,255,.55);

    text-decoration: none;

    font-size: 11px;

    border-radius: 20px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    transition:
        .2s ease;
}

.home-button:hover {

    color: white;

    background:
        rgba(255,255,255,.08);
}


/* =========================================================
   FLOATING HEARTS
   ========================================================= */

.floating-heart {

    position: fixed;

    bottom: -30px;

    color:
        rgba(255,92,168,.65);

    pointer-events: none;

    animation:
        floatHeart
        linear forwards;
}

@keyframes floatHeart {

    0% {
        transform:
            translateY(0)
            scale(.7)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(var(--drift))
            scale(1.2)
            rotate(25deg);

        opacity: 0;
    }
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    margin-top: 22px;

    color:
        rgba(255,255,255,.25);

    font-size: 9px;

    letter-spacing: .4px;
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    .page {
        padding: 20px 12px;
    }

    .card {
        padding:
            30px
            19px
            24px;

        border-radius: 25px;
    }

    .big-heart {
        width: 68px;
        height: 68px;
    }

    .big-heart i {
        font-size: 29px;
    }

    .message {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND PHOTOS
     ===================================================== -->

<div class="photo-bg">

    <img src="images/photo1.jpg">
    <img src="images/photo2.jpg">
    <img src="images/photo3.jpg">
    <img src="images/photo4.jpg">

</div>


<!-- MOVING LIGHTS -->

<div class="light one"></div>
<div class="light two"></div>


<!-- STARS -->

<div class="stars" id="stars"></div>


<!-- =====================================================
     MAIN
     ===================================================== -->

<main class="page">

    <section class="card">


        <!-- HEART -->

        <div class="big-heart">

            <i class="fa-solid fa-heart"></i>

        </div>


        <!-- LABEL -->

        <div class="small-label">
            A little something
        </div>


        <!-- TITLE -->

        <h1>
            Just Because...
        </h1>


        <!-- DIVIDER -->

        <div class="divider">

            <span></span>

            <i class="fa-solid fa-heart"></i>

            <span></span>

        </div>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message"
        >
        </div>


        <!-- QUOTE -->

        <div
            class="quote"
            id="quote"
        >
        </div>


        <!-- NEXT -->

        <button
            class="next-message"
            id="nextMessage"
        >

            <i class="fa-solid fa-wand-magic-sparkles"></i>

            Give me another one

        </button>


        <!-- HOME -->

        <a
            href="index.html"
            class="home-button"
        >

            <i class="fa-solid fa-house"></i>

            Back to Our Home

        </a>


        <!-- FOOTER -->

        <div class="footer">

            made with a little love, just for you ❤️

        </div>


    </section>

</main>


<script>

/* =========================================================
   PD — JUST BECAUSE
   JAVASCRIPT
   ========================================================= */


/* =========================================================
   ROMANTIC MESSAGES
   ========================================================= */

const messages = [

    "There doesn't have to be a special day for me to remind you that <strong>you are loved.</strong> ❤️",

    "Just in case you forgot today... <strong>you are one of my favourite parts of life.</strong> 💜",

    "No anniversary. No birthday. No reason. <strong>Just you.</strong> And honestly, that's reason enough. ❤️",

    "Somewhere between all our conversations, laughs and little moments, <strong>you became very special to me.</strong> ✨",

    "If I could give you one thing today, it would be the ability to see yourself through my eyes. <strong>You'd understand why I love you.</strong> 💕",

    "I don't need a special occasion to choose you. <strong>I would choose you on an ordinary Tuesday too.</strong> 🌙",

    "Whatever today brings, I hope you remember there is someone somewhere smiling simply because <strong>you exist.</strong> ❤️",

    "You are not just a chapter in my story. <strong>You are one of the reasons I enjoy reading it.</strong> 📖💜",

    "Maybe this little page is unnecessary... but loving you has never felt unnecessary. <strong>Not even once.</strong> ❤️",

    "Just because you're you. Just because I'm grateful for you. <strong>Just because... I love you.</strong> 💕"

];


const quotes = [

    "And somehow, you still make ordinary moments feel special.",

    "Some people become home without ever having a key.",

    "My favourite place is wherever I get to share a moment with you.",

    "There are memories I haven't made with you yet that I'm already looking forward to.",

    "The best part is knowing there is still so much ahead of us.",

    "If I had to choose again, I'd still find my way to you.",

    "Some hearts simply recognize each other.",

    "You make my little world a little brighter."

];


const messageElement =
    document.getElementById("message");

const quoteElement =
    document.getElementById("quote");

const nextButton =
    document.getElementById("nextMessage");


let lastMessage = -1;


/* =========================================================
   SHOW RANDOM MESSAGE
   ========================================================= */

function showMessage() {

    let index;

    do {

        index =
            Math.floor(
                Math.random() *
                messages.length
            );

    } while (
        index === lastMessage &&
        messages.length > 1
    );

    lastMessage = index;


    messageElement.style.animation =
        "none";

    quoteElement.style.opacity =
        "0";


    setTimeout(() => {

        messageElement.innerHTML =
            messages[index];

        quoteElement.textContent =
            quotes[
                Math.floor(
                    Math.random() *
                    quotes.length
                )
            ];


        messageElement.style.animation =
            "messageAppear .7s ease";

        setTimeout(() => {

            quoteElement.style.opacity =
                "1";

        }, 250);

    }, 80);

}


/* =========================================================
   FIRST MESSAGE
   ========================================================= */

showMessage();


/* =========================================================
   NEXT MESSAGE
   ========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        showMessage();

        createHeartBurst();

    }
);


/* =========================================================
   STARS
   ========================================================= */

const stars =
    document.getElementById("stars");


for (
    let i = 0;
    i < 45;
    i++
) {

    const star =
        document.createElement("span");

    star.className =
        "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.setProperty(
        "--speed",
        (1.5 + Math.random() * 3) + "s"
    );

    star.style.animationDelay =
        Math.random() * 3 + "s";

    stars.appendChild(star);

}


/* =========================================================
   FLOATING HEARTS
   ========================================================= */

function createFloatingHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    heart.innerHTML =
        Math.random() > .5
            ? "♥"
            : "♡";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (10 + Math.random() * 15) + "px";

    heart.style.setProperty(
        "--drift",
        (-60 + Math.random() * 120) + "px"
    );

    heart.style.animationDuration =
        (7 + Math.random() * 7) + "s";

    document.body.appendChild(heart);


    setTimeout(
        () => heart.remove(),
        15000
    );

}


/* =========================================================
   HEARTS CONTINUOUSLY
   ========================================================= */

setInterval(
    createFloatingHeart,
    1300
);


/* =========================================================
   HEART BURST WHEN BUTTON IS CLICKED
   ========================================================= */

function createHeartBurst() {

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        setTimeout(
            createFloatingHeart,
            i * 90
        );

    }

}


/* =========================================================
   CLICK ANYWHERE = LITTLE HEART
   ========================================================= */

document.addEventListener(
    "click",
    event => {

        if (
            event.target.closest(
                "button, a"
            )
        ) return;


        const heart =
            document.createElement("div");

        heart.innerHTML = "♥";

        heart.style.position =
            "fixed";

        heart.style.left =
            event.clientX + "px";

        heart.style.top =
            event.clientY + "px";

        heart.style.color =
            "#ff5ca8";

        heart.style.fontSize =
            "14px";

        heart.style.pointerEvents =
            "none";

        heart.style.zIndex =
            "999";

        heart.style.textShadow =
            "0 0 10px rgba(255,70,160,.8)";

        document.body.appendChild(
            heart
        );


        heart.animate(
            [
                {
                    transform:
                        "translate(-50%,-50%) scale(.5)",
                    opacity: 0
                },

                {
                    transform:
                        "translate(-50%,-90%) scale(1.2)",
                    opacity: 1
                },

                {
                    transform:
                        "translate(-50%,-180%) scale(.8)",
                    opacity: 0
                }
            ],
            {
                duration: 900,
                easing: "ease-out"
            }
        );


        setTimeout(
            () => heart.remove(),
            950
        );

    }
);

</script>

</body>

</html>
